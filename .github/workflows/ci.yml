# Trading Science Framework - CI/CD Pipeline
#
# Fail-fast, scientific rigor: lint → types → tests → governance gates
# Solo pasa a deployment si TODOS los gates pasan

name: CI/CD - Scientific Trading Framework

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      skip_governance:
        description: 'Skip governance gates (emergency only)'
        required: false
        default: 'false'
        type: boolean

env:
  PYTHON_VERSION: '3.11'
  POETRY_VERSION: '1.8.0'

jobs:
  # ============================================================
  # CODE QUALITY (Fast, fail-first)
  # ============================================================
  code-quality:
    name: Code Quality (Ruff + MyPy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]" --quiet

      - name: Ruff Lint
        run: ruff check .

      - name: Ruff Format Check
        run: ruff format --check .

      - name: MyPy Type Check
        run: mypy tsf --strict

  # ============================================================
  # UNIT TESTS (Fast, isolated)
  # ============================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]" --quiet

      - name: Run Unit Tests
        run: |
          pytest tests/unit -v --tb=short -x -q \
            --cov=tsf \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unit
          fail_ci_if_error: true

  # ============================================================
  # INTEGRATION TESTS (Requires OANDA demo keys)
  # ============================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    env:
      OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
      OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
      OANDA_ENVIRONMENT: practice
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]" --quiet

      - name: Skip if no credentials
        if: env.OANDA_ACCOUNT_ID == '' || env.OANDA_API_KEY == ''
        run: |
          echo "⚠️ OANDA credentials not set — skipping integration tests"
          exit 0

      - name: Run Integration Tests
        run: |
          pytest tests/integration -v --tb=short -x -q \
            -k "not requires_live"

  # ============================================================
  # GOVERNANCE GATES (Scientific rigor - FAIL-CLOSED)
  # ============================================================
  governance-gates:
    name: Governance Gates (Holdout)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [code-quality, unit-tests]
    if: github.event.inputs.skip_governance != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Holdout Toolchain
        run: |
          pip install \
            purgedcv>=0.1.6 \
            factor-qc>=0.1.3 \
            falsification-ledger>=0.1.3 \
            lookahead-free>=0.1.3 \
            pit-adjuster>=0.1.3 \
            lesson-book>=0.1.1 \
            holdout-governance>=0.4.0 \
            --quiet

      - name: Install Framework
        run: pip install -e . --quiet

      - name: Verify Toolchain
        run: |
          echo "Verifying Holdout toolchain..."
          python -m purgedcv --version
          python -m factor_qc --version
          python -m falsification_ledger --version
          python -m lookahead_free --version
          python -m pit_adjuster --version
          python -m lesson_book --version
          gov --version

      - name: Run Governance Check on Manifests
        run: |
          echo "Checking research artifacts..."
          for manifest in research/artifacts/*.json; do
            if [ -f "$manifest" ]; then
              echo "🔒 Checking $manifest"
              gov check --manifest "$manifest" || {
                echo "❌ Governance gate FAILED for $manifest"
                exit 1
              }
            fi
          done
          echo "✅ All governance gates passed"

      - name: Verify Ledger Integrity
        run: |
          if [ -f "governance/ledger.jsonl" ]; then
            echo "Verifying ledger hash-chain..."
            gov health --ledger governance/ledger.jsonl || exit 1
            echo "✅ Ledger integrity verified"
          fi

  # ============================================================
  # DOCUMENTATION BUILD
  # ============================================================
  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install docs dependencies
        run: pip install mkdocs mkdocs-material mkdocstrings[python] --quiet

      - name: Build Docs
        run: mkdocs build --strict

      - name: Upload Docs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: site/
          retention-days: 7

  # ============================================================
  # DEPLOY TO GITHUB PAGES (main branch only)
  # ============================================================
  deploy-docs:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [docs, governance-gates]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Docs Artifact
        uses: actions/download-artifact@v4
        with:
          name: docs
          path: site/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ============================================================
  # DOCKER BUILD (Multi-stage, minimal)
  # ============================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [code-quality, unit-tests]
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile
          push: false
          load: true
          tags: trading-science-framework:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}

      - name: Test Docker Image
        run: |
          docker run --rm trading-science-framework:${{ github.sha }} tsf --check-config

  # ============================================================
  # SECURITY SCAN
  # ============================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy (FS scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Check for Secrets (GitLeaks)
        uses: gitleaks/gitleaks-action@v2
        with:
          args: --verbose --redact

  # ============================================================
  # RELEASE (Tagged versions only)
  # ============================================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [governance-gates, docker-build, security]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog
        id: changelog
        run: |
          git log $(git describe --tags --abbrev=0 HEAD^)..HEAD --pretty=format:"- %s (%h)" --reverse > CHANGELOG_RELEASE.md
          cat CHANGELOG_RELEASE.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            deployment/docker/Dockerfile
            deployment/systemd/*
            deployment/scripts/*
          body_path: CHANGELOG_RELEASE.md
          draft: false
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max