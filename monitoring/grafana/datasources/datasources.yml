# Trading Science Framework - Grafana Datasource Provisioning
#
# Configuración automática de datasources al iniciar Grafana
# Ver: https://grafana.com/docs/grafana/latest/administration/provisioning/

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      queryTimeout: "60s"
      httpMethod: "POST"
    version: 1

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: "traceID"
          matcherRegex: "trace[=: ]*([a-f0-9]+)"
          url: "http://tempo:3200/tempo/traces/${__value.raw}"
    version: 1

  - name: PostgreSQL (TSF)
    type: postgres
    access: proxy
    url: postgres:5432
    database: tsf
    user: tsf
    secureJsonData:
      password: "${POSTGRES_PASSWORD}"
    jsonData:
      sslmode: "disable"
      maxOpenConns: 10
      maxIdleConns: 2
      connMaxLifetime: 14400
      timeseries:
        - name: "timestamp"
          value: "created_at"
    editable: false
    version: 1