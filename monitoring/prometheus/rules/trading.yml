# Trading Science Framework - Prometheus Alerting Rules
#
# Alertas críticas para trading científico:
# - Risk management: breakers, drawdowns, daily loss
# - System health: API connectivity, latency, errors
# - Research integrity: gate failures, ledger corruption
# - Execution quality: slippage, fill rates, rejections

groups:
  - name: trading.risk
    interval: 30s
    rules:
      # Daily Loss Breaker
      - alert: DailyLossBreakerTriggered
        expr: tsf_daily_loss_pct > 2.0
        for: 1m
        labels:
          severity: critical
          domain: risk
        annotations:
          summary: "Daily loss breaker triggered"
          description: "Daily loss {{ $value | printf \"%.2f\" }}% exceeds 2% limit. Trading halted."

      # Max Drawdown
      - alert: MaxDrawdownExceeded
        expr: tsf_max_drawdown_pct > 10.0
        for: 5m
        labels:
          severity: critical
          domain: risk
        annotations:
          summary: "Maximum drawdown exceeded"
          description: "Portfolio drawdown {{ $value | printf \"%.2f\" }}% exceeds 10% limit. Review required."

      # Daily Trade Limit
      - alert: DailyTradeLimitApproaching
        expr: tsf_trades_today / 5.0 > 0.8
        for: 5m
        labels:
          severity: warning
          domain: risk
        annotations:
          summary: "Daily trade limit approaching"
          description: "{{ $value | printf \"%.0f\" }}% of daily trade limit used."

      # Open Positions Limit
      - alert: TooManyOpenPositions
        expr: tsf_open_positions > 1
        for: 1m
        labels:
          severity: warning
          domain: risk
        annotations:
          summary: "Multiple open positions detected"
          description: "{{ $value }} open positions (max 1 allowed)."

  - name: trading.execution
    interval: 30s
    rules:
      # High Slippage
      - alert: HighSlippageDetected
        expr: tsf_avg_slippage_pips > 2.0
        for: 5m
        labels:
          severity: warning
          domain: execution
        annotations:
          summary: "High slippage detected"
          description: "Average slippage {{ $value | printf \"%.2f\" }} pips exceeds 2 pip threshold."

      # Order Rejection Rate
      - alert: HighOrderRejectionRate
        expr: rate(tsf_orders_rejected_total[5m]) / rate(tsf_orders_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          domain: execution
        annotations:
          summary: "High order rejection rate"
          description: "{{ $value | printf \"%.1f\" }}% of orders rejected in last 5 minutes."

      # API Latency
      - alert: HighAPILatency
        expr: histogram_quantile(0.95, rate(tsf_oanda_api_latency_seconds_bucket[5m])) > 1.0
        for: 5m
        labels:
          severity: warning
          domain: execution
        annotations:
          summary: "High OANDA API latency"
          description: "P95 latency {{ $value | printf \"%.2f\" }}s exceeds 1s threshold."

      # Connection Loss
      - alert: OANDAConnectionLost
        expr: tsf_oanda_connected == 0
        for: 1m
        labels:
          severity: critical
          domain: execution
        annotations:
          summary: "OANDA connection lost"
          description: "WebSocket/REST connection to OANDA unavailable for > 1 minute."

  - name: trading.research
    interval: 60s
    rules:
      # Factor-QC Gate Failure
      - alert: FactorQCGateFailed
        expr: tsf_factor_qc_gate_result == 1
        for: 1m
        labels:
          severity: critical
          domain: research
        annotations:
          summary: "Factor-QC gate failed (P0 blocker)"
          description: "Backtest validation failed mandatory gate. Check factor-qc output."

      # Governance Check Failure
      - alert: GovernanceCheckFailed
        expr: tsf_governance_check_result == 2
        for: 1m
        labels:
          severity: critical
          domain: research
        annotations:
          summary: "Governance check blocked release"
          description: "gov check returned BLOCK (exit 2). Manifest cannot be released."

      # Ledger Corruption
      - alert: LedgerIntegrityCompromised
        expr: tsf_ledger_health_ok == 0
        for: 1m
        labels:
          severity: critical
          domain: research
        annotations:
          summary: "Falsification ledger hash-chain broken"
          description: "gov health detected ledger tampering. IMMEDIATE INVESTIGATION REQUIRED."

      # Backtest Overfitting
      - alert: BacktestOverfittingDetected
        expr: tsf_backtest_pbo > 0.05
        for: 1m
        labels:
          severity: warning
          domain: research
        annotations:
          summary: "Probability of Backtest Overfitting high"
          description: "PBO = {{ $value | printf \"%.3f\" }} exceeds 5% threshold."

  - name: trading.system
    interval: 60s
    rules:
      # High Memory Usage
      - alert: HighMemoryUsage
        expr: (container_memory_usage_bytes / container_spec_memory_limit_bytes) > 0.85
        for: 5m
        labels:
          severity: warning
          domain: system
        annotations:
          summary: "High memory usage"
          description: "Container {{ $labels.container }} memory usage at {{ $value | printf \"%.1f\" }}%."

      # High CPU Usage
      - alert: HighCPUUsage
        expr: (rate(container_cpu_usage_seconds_total[5m]) / container_spec_cpu_quota / container_spec_cpu_period) > 0.85
        for: 5m
        labels:
          severity: warning
          domain: system
        annotations:
          summary: "High CPU usage"
          description: "Container {{ $labels.container }} CPU usage at {{ $value | printf \"%.1f\" }}%."

      # Disk Space
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.15
        for: 5m
        labels:
          severity: warning
          domain: system
        annotations:
          summary: "Disk space low"
          description: "Root filesystem {{ $value | printf \"%.1f\" }}% free."

      # Container Restart Loop
      - alert: ContainerRestartLoop
        expr: rate(container_restart_count[15m]) > 0.1
        for: 2m
        labels:
          severity: critical
          domain: system
        annotations:
          summary: "Container restart loop detected"
          description: "Container {{ $labels.container }} restarting frequently."