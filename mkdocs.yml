site_name: Marco de Ciencia del Trading
site_url: https://diegoalejandrosaenzfalcon.github.io/Trading-Ciencia/
site_description: Marco de Investigación Científica Aplicada al Trading — Libre, Honesto, Verificable
site_author: Diego Alejandro Saenz Falcon
copyright: Copyright &copy; 2026 Diego Alejandro Saenz Falcon - MIT License

repo_url: https://github.com/DiegoAlejandroSaenzFalcon/Trading-Ciencia
repo_name: DiegoAlejandroSaenzFalcon/Trading-Ciencia
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github
    logo: material/flask-outline
    favicon: material/flask-outline

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.details
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["../tsf"]
          options:
            show_source: true
            show_signature: true
            show_signature_annotations: true
            merge_init_into_class: true
            separate_signature: true
  - git-revision-date-localized:
      type: timeago
      fallback_to_build_date: true
  - minify:
      minify_html: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DiegoAlejandroSaenzFalcon
    - icon: fontawesome/brands/github
      link: https://github.com/DiegoAlejandroSaenzFalcon/Trading-Ciencia
  generator: false
  version:
    provider: mike

nav:
  - Inicio: index.md
  - Guía de Inicio Rápido: quickstart.md
  - "Fase 0: Fundación":
      - "Qué es Trading Realmente": 00-foundation/01-what-is-trading.md
      - "Método Científico Aplicado": 00-foundation/02-scientific-method.md
      - "Realidad del Riesgo": 00-foundation/03-risk-reality.md
  - "Fase 2: Investigación":
      - "Recuperación forense del corpus MT5": 02-research/04-mt5-corpus-recovery.md
  - Estado de la documentación: ROADMAP.md

extra_css:
  - stylesheets/extra.css



