[project]
name = "trading-science-framework"
version = "0.1.0"
description = "Marco de Investigación Científica Aplicada al Trading — Libre, Honesto, Verificable"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Diego Saenz", email = "diego.saenz@users.noreply.github.com"}
]
maintainers = [
    {name = "Diego Saenz", email = "diego.saenz@users.noreply.github.com"}
]
keywords = [
    "trading",
    "quantitative-finance",
    "algorithmic-trading",
    "scientific-method",
    "reproducible-research",
    "backtesting",
    "risk-management",
    "financial-ml"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics"
]
urls.Homepage = "https://diegosaenz.github.io/trading-science-framework/"
urls.Repository = "https://github.com/DiegoSaenz/trading-science-framework"
urls.Issues = "https://github.com/DiegoSaenz/trading-science-framework/issues"
urls.Documentation = "https://diegosaenz.github.io/trading-science-framework/"
dependencies = [
    # Core scientific stack
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # Holdout Labs toolchain (validación científica honesta)
    "purgedcv>=0.1.6",
    "factor-qc>=0.1.3",
    "falsification-ledger>=0.1.3",
    "lookahead-free>=0.1.3",
    "pit-adjuster>=0.1.3",
    "lesson-book>=0.1.1",
    "holdout-governance>=0.4.0",

    # Broker API (OANDA - Forex/Metales, demo gratis)
    "v20>=3.0.25",

    # Backtesting engines
    "vectorbt>=0.26.0",
    "backtrader>=1.9.78",

    # Technical indicators
    "ta-lib>=0.4.28",
    "pandas-ta>=0.3.14",

    # Persistence
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",

    # Async & HTTP
    "aiohttp>=3.9.0",
    "httpx>=0.27.0",

    # Observability
    "prometheus-client>=0.19.0",
    "structlog>=24.1.0",
    "loguru>=0.7.0",

    # Configuration
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",

    # CLI
    "typer>=0.12.0",
    "rich>=13.7.0",

    # Testing
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.99.0",

    # Utilities
    "python-dateutil>=2.9.0",
    "pytz>=2024.1",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "black>=24.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pytest-cov>=5.0.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=1.0.0",
]
monitoring = [
    "grafana-api>=1.0.0",
]
web = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
]
notebooks = [
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.21.0",
]

[project.scripts]
tsf = "tsf.cli:app"
tsf-data = "tsf.data.cli:app"
tsf-research = "tsf.research.cli:app"
tsf-validate = "tsf.validation.cli:app"
tsf-execute = "tsf.execution.cli:app"
tsf-govern = "tsf.governance.cli:app"
tsf-learn = "tsf.psychology.cli:app"

[build-system]
requires = ["setuptools>=69.0", "wheel>=0.42.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tsf*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "ARG", "PTH", "PL", "TRY", "SIM", "TID", "RET"]
ignore = ["S101", "ARG001", "ARG002"]
per-file-ignores = {
    "tests/*": ["S101", "ARG001", "ARG002"],
    "examples/*": ["S101", "T201"]
}

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
implicit_reexport = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --strict-config"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "requires_api: Tests requiring API keys"
]

[tool.coverage.run]
source = ["tsf"]
omit = ["tests/*", "examples/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:"
]

[tool.pre-commit-hooks]
hooks = [
    {id = "ruff", name = "ruff", entry = "ruff check", language = "system", types = ["python"]},
    {id = "ruff-format", name = "ruff-format", entry = "ruff format", language = "system", types = ["python"]},
    {id = "mypy", name = "mypy", entry = "mypy", language = "system", types = ["python"]},
    {id = "pytest", name = "pytest", entry = "pytest", language = "system", types = ["python"], stages = ["commit"]},
]

[tool.mkdocs]
site_name = "Trading Science Framework"
site_url = "https://diegosaenz.github.io/trading-science-framework/"
repo_url = "https://github.com/DiegoSaenz/trading-science-framework"
repo_name = "DiegoSaenz/trading-science-framework"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 Diego Saenz - MIT License"
theme:
  name = "material"
  palette:
    - scheme = "default"
      primary = "indigo"
      accent = "amber"
      toggle:
        icon = "material/brightness-7"
        name = "Switch to dark mode"
    - scheme = "slate"
      primary = "indigo"
      accent = "amber"
      toggle:
        icon = "material/brightness-4"
        name = "Switch to light mode"
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo = "fontawesome/brands/github"
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums = true
      line_spans = __span
      pygments_lang_class = true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style = true
  - pymdownx.tasklist:
      custom_checkbox = true
  - pymdownx.details
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink = true
      toc_depth = 3
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["tsf"]
          options:
            show_source = true
            show_signature = true
            show_signature_annotations = true
            merge_init_into_class = true
            separate_signature = true
  - git-revision-date-localized:
      type = "timeago"
      fallback_to_build_date = true
  - minify:
      minify_html = true

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "$version"
version_files = ["pyproject.toml"]

[tool.uv]
dev-dependencies = [
    "ruff",
    "black",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings",
]