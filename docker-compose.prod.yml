# Docker Compose - Production Override
#
# Uso: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Diferencias con desarrollo:
# - Target: runtime (mínimo, non-root, read-only)
# - Resource limits estrictos
# - Healthchecks obligatorios
# - Restart policies
# - Logging drivers
# - Secrets via Docker secrets (no env_file)

version: '3.9'

services:
  app:
    build:
      target: runtime
    container_name: tsf-app-prod
    env_file: []  # Usar secrets, no .env
    environment:
      - TSF_ENV=production
      - DATABASE_URL=postgresql+asyncpg://tsf:{{POSTGRES_PASSWORD}}@postgres:5432/tsf
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - data_raw:/app/data/raw:rw
      - data_pit:/app/data/pit:rw
      - data_audits:/app/data/audits:rw
      - data_manifests:/app/data/manifests:rw
      - research_hypotheses:/app/research/hypotheses:rw
      - research_pipelines:/app/research/pipelines:rw
      - research_backtests:/app/research/backtests:rw
      - research_evidence:/app/research/evidence:rw
      - research_adjudications:/app/research/adjudications:rw
      - research_artifacts:/app/research/artifacts:rw
      - strategies:/app/strategies:ro
      - lessons:/app/lessons:rw
      - governance:/app/governance:rw
      - logs:/app/logs:rw
      - config:/app/config:ro
    # No exponer puertos directamente - usar reverse proxy
    # ports: []
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 60s
      placement:
        constraints:
          - node.role == manager
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  postgres:
    container_name: tsf-postgres-prod
    env_file: []
    environment:
      - POSTGRES_DB=tsf
      - POSTGRES_USER=tsf
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 60s

  redis:
    container_name: tsf-redis-prod
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass {{REDIS_PASSWORD}}
    volumes:
      - redis_prod_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure

  prometheus:
    container_name: tsf-prometheus-prod
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_prod_data:/prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

  grafana:
    container_name: tsf-grafana-prod
    env_file: []
    environment:
      - GF_SECURITY_ADMIN_USER_FILE=/run/secrets/grafana_admin_user
      - GF_SECURITY_ADMIN_PASSWORD_FILE=/run/secrets/grafana_admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_prod_data:/var/lib/grafana
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure

  loki:
    container_name: tsf-loki-prod
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki:/etc/loki:ro
      - loki_prod_data:/loki
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

  promtail:
    container_name: tsf-promtail-prod
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./logs:/var/log/tsf:ro
      - ./monitoring/promtail:/etc/promtail:ro
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

volumes:
  data_raw:
    driver: local
  data_pit:
    driver: local
  data_audits:
    driver: local
  data_manifests:
    driver: local
  research_hypotheses:
    driver: local
  research_pipelines:
    driver: local
  research_backtests:
    driver: local
  research_evidence:
    driver: local
  research_adjudications:
    driver: local
  research_artifacts:
    driver: local
  strategies:
    driver: local
  lessons:
    driver: local
  governance:
    driver: local
  logs:
    driver: local
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  prometheus_prod_data:
    driver: local
  grafana_prod_data:
    driver: local
  loki_prod_data:
    driver: local

secrets:
  postgres_password:
    external: true
  redis_password:
    external: true
  grafana_admin_user:
    external: true
  grafana_admin_password:
    external: true